<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Dynamic Flow Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
      }
      
      @keyframes floatPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-12px) scale(1.05); opacity: 0.7; }
        100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      }

      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes rotateRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .animated-blob-1 {
        animation: floatPulse 8s ease-in-out infinite;
        transform-origin: center;
      }

      .animated-blob-2 {
        animation: floatPulse 11s ease-in-out infinite 2s;
        transform-origin: center;
      }

      .flowing-line {
        stroke-dasharray: 12, 12;
        animation: dashMove 15s linear infinite;
      }

      .spinning-ring {
        animation: rotateRing 25s linear infinite;
        transform-origin: 1050px 200px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- DYNAMIC BACKGROUND ELEMENTS -->
  <g class="animated-blob-1">
    <circle cx="200" cy="100" r="140" fill="#0284c7" opacity="0.25" filter="url(#blurGlow)"/>
  </g>
  <g class="animated-blob-2">
    <circle cx="1000" cy="300" r="160" fill="#7c3aed" opacity="0.25" filter="url(#blurGlow)"/>
  </g>

  <!-- Background Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Animated Flow Lines in Background -->
  <path d="M -50 320 Q 300 380 600 280 T 1250 180" fill="none" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.5" class="flowing-line"/>
  <path d="M -50 100 Q 400 20 800 150 T 1250 80" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" class="flowing-line"/>

  <!-- Geometric Decorative Graphic (Right Side) -->
  <g transform="translate(100, 0)">
    <circle cx="950" cy="200" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="spinning-ring" stroke-dasharray="10 15"/>
    <circle cx="950" cy="200" r="75" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="950" cy="200" r="40" fill="url(#cyanPurple)" opacity="0.8"/>
    <path d="M 935 200 A 15 15 0 0 1 960 190 A 18 18 0 0 1 975 205 A 12 12 0 0 1 970 215 L 935 215 A 12 12 0 0 1 935 200 Z" fill="#ffffff"/>
  </g>

  <!-- FOREGROUND CONTENT CARD -->
  <g transform="translate(70, 70)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="16" y="22" class="badge-text">⚡ ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="95" class="title-text">Awesome Cloud Migration</text>
    <text x="0" y="145" class="title-text" fill="url(#cyanPurple)">Tracking &amp; Orchestration 🗺️ ⚙️</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle-text">Curated Directory of Migration Platforms, Wave Planning &amp; Workflow Engines</text>
    <text x="0" y="225" class="subtitle-text" font-size="16px" fill="#64748b">Updated for 2026 • Commercial Suites &amp; Self-Hosted Open-Source Frameworks</text>
  </g>
</svg>
