<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><filter id="blurGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/></filter><style>@keyframes floatPulse{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-12px) scale(1.05);opacity:.7}}@keyframes dashMove{0%{stroke-dashoffset:200}}@keyframes rotateRing{0%{transform:rotate(0deg)}}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.animated-blob-1,.animated-blob-2{animation:floatPulse 8s ease-in-out infinite;transform-origin:center}.animated-blob-2{animation:floatPulse 11s ease-in-out infinite 2s}.flowing-line{stroke-dasharray:12,12;animation:dashMove 15s linear infinite}.spinning-ring{animation:rotateRing 25s linear infinite;transform-origin:1050px 200px}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g class="animated-blob-1"><circle cx="200" cy="100" r="140" fill="#0284c7" filter="url(#blurGlow)" opacity=".25"/></g><g class="animated-blob-2"><circle cx="1000" cy="300" r="160" fill="#7c3aed" filter="url(#blurGlow)" opacity=".25"/></g><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="200" x2="200" y1="0" y2="400"/><line x1="400" x2="400" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="800" x2="800" y1="0" y2="400"/><line x1="1000" x2="1000" y1="0" y2="400"/></g><path fill="none" stroke="url(#cyanPurple)" stroke-width="2" d="M -50 320 Q 300 380 600 280 T 1250 180" class="flowing-line" opacity=".5"/><path fill="none" stroke="#3b82f6" stroke-width="1.5" d="M -50 100 Q 400 20 800 150 T 1250 80" class="flowing-line" opacity=".3"/><g transform="translate(100, 0)"><circle cx="950" cy="200" r="110" fill="none" stroke="#38bdf8" stroke-dasharray="10 15" stroke-opacity=".3" stroke-width="1.5" class="spinning-ring"/><circle cx="950" cy="200" r="75" fill="none" stroke="#8b5cf6" stroke-opacity=".5" stroke-width="2"/><circle cx="950" cy="200" r="40" fill="url(#cyanPurple)" opacity=".8"/><path fill="#fff" d="M 935 200 A 15 15 0 0 1 960 190 A 18 18 0 0 1 975 205 A 12 12 0 0 1 970 215 L 935 215 A 12 12 0 0 1 935 200 Z"/></g><g transform="translate(70, 70)"><rect width="310" height="34" x="0" y="0" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" rx="17"/><text x="16" y="22" class="badge-text">⚡ ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text><text x="0" y="95" class="title-text">Awesome Cloud Migration</text><text x="0" y="145" fill="url(#cyanPurple)" class="title-text">Tracking &amp; Orchestration 🗺️ ⚙️</text><text x="0" y="195" class="subtitle-text">Curated Directory of Migration Platforms, Wave Planning &amp; Workflow Engines</text><text x="0" y="225" fill="#64748b" class="subtitle-text" font-size="16">Updated for 2026 • Commercial Suites &amp; Self-Hosted Open-Source Frameworks</text></g></svg>